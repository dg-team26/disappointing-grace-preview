<div>
<style>
/* Keep MailerLite's page shell from changing the custom page. */
.ml-section-wrapper:has(.ml-code-html)>.ml-animate{max-width:none!important;width:100%!important;padding-left:0!important;padding-right:0!important}
.ml-section-wrapper .list-group-item:has(.ml-code-html)>div{padding-bottom:0!important;--element-padding-bottom-mobile:0px}
.ml-section-wrapper:has(.ml-code-html) .grid:has(>.ml-desktop-layout){row-gap:0!important}
.ml-code-html{font-family:Georgia,'Times New Roman',serif;font-size:1.0625rem;line-height:1.7;color:#3d3d3d}
.ml-code-html .hero,.ml-code-html .section,.ml-code-html .storm-quote{font-family:Georgia,'Times New Roman',serif;line-height:1.7}
.ml-code-html .site-nav__links,.ml-code-html .footer-links{margin:0;padding:0;list-style:none}
.ml-code-html .container{width:100%;max-width:1080px;margin-left:auto;margin-right:auto;padding-left:24px;padding-right:24px}
/* Keep older generated styles from overriding the launch cards. */
.ml-code-html #formats .format-card.dg-featured{border:2px solid #c8963e}
.ml-code-html #formats .format-card .dg-format-label{font:500 .75rem/1.5 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:#86621f;margin-bottom:12px}
/* Softer hero copy and more room between the cover and text. */
.ml-code-html .hero .hero__desc{font-family:var(--sans,system-ui)!important;font-size:1.0625rem;line-height:1.85;font-weight:400;letter-spacing:normal;max-width:500px;color:#f5f0e8;opacity:.85;margin-bottom:32px}
.ml-code-html .hero .hero__text{max-width:520px}
.ml-code-html .hero .dg-choice-note{display:none}
.ml-code-html .hero .dg-audio{margin-top:28px!important}
@media(min-width:768px){.ml-code-html .hero .hero__inner{gap:72px}}
@media(max-width:767px){.ml-code-html .hero .hero__inner{gap:36px}.ml-code-html .hero .hero__desc{margin-left:auto;margin-right:auto}}

/* Preserve the current component design when older MailerLite styles remain. */
.ml-code-html .about-book{grid-template-columns:minmax(0,1fr);gap:32px}
.ml-code-html .pullquote{padding:16px 0 16px 24px;margin:0 0 24px;line-height:1.6}
.ml-code-html .pullquote:last-child{margin-bottom:0}
.ml-code-html .author-grid{grid-template-columns:minmax(0,1fr);gap:32px}
.ml-code-html .author-photo{width:220px;height:220px;border:4px solid #ffffff40;box-shadow:0 8px 32px #0005}
.ml-code-html .formats-grid{grid-template-columns:minmax(0,1fr);gap:24px;margin-top:32px}
.ml-code-html .format-card{padding:28px 24px}
.ml-code-html .site-footer{padding:32px 0;color:#ffffffb3;line-height:1.6}
.ml-code-html .footer-logo{height:48px;opacity:.85}
.ml-code-html .footer-links{gap:12px 24px}
.ml-code-html .footer-links a,.ml-code-html .footer-contact a{color:#ffffffb3}
.ml-code-html .footer-links a:hover{color:var(--gold)}
@media(min-width:768px){.ml-code-html .about-book{grid-template-columns:repeat(2,minmax(0,1fr));gap:48px}.ml-code-html .author-grid{grid-template-columns:240px minmax(0,1fr);gap:40px}.ml-code-html .formats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:767px){.ml-code-html .pullquote{padding-left:20px}.ml-code-html .author-photo{width:200px;height:200px}.ml-code-html .site-footer{padding:28px 0}}
</style>
</div>
